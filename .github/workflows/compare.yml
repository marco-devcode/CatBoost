name: Confronto Pi-Rating

# Esegue src/compare_ratings.py e stampa Accuracy + F1 (con vs senza Pi-Rating).
# Solo manuale: gh workflow run compare.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Confronto CON vs SENZA Pi-Rating
        run: python src/compare_ratings.py
