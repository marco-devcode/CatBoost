name: Aggiorna quote e risultati

# Ogni giorno a mezzanotte UTC: rigenera i JSON delle previsioni per OGNI
# campionato, cosi' i risultati reali e la simulazione Kelly sul sito
# si aggiornano da soli entro qualche ora dalla fine delle partite.
#
# PERCHE' LA CATENA COMPLETA (download -> clean -> ratings -> features ->
# model -> predict) E NON SOLO "predict":
# il modello (.cbm) e' GITIGNORED, quindi su un runner fresco non esiste.
# Un workflow che lancia solo predict_fixtures muore con
#   FileNotFoundError: models/catboost_seriea_v1.cbm
# e il sito resta fermo (e' successo dal 14-10 al 20-10: 7 run notturni
# falliti in fila). Il .cbm NON va committato: e' un binario e in due job
# in matrice finirebbe in conflitto add/add a ogni rebase.
#
# Il commit e' limitato a webapp/public/: e' il JSON che il sito legge.
# data/ e models/ restano al workflow "Pipeline Campionati" (lunedi'/giovedi'),
# cosi' i due workflow non si pestano i piedi sui CSV e sui JSON.
#
# Perche' ogni giorno e non lunedi/giovedi come pipeline.yml: le quote
# della giornata successiva compaiono su football-data alcuni giorni prima
# del fischio d'inizio, e senza il giro quotidiano il sito mostrava
# bm=null sulle partite imminenti (caso Giornata 6: 10 partite senza quote).

on:
  schedule:
    - cron: "0 0 * * *"   # mezzanotte UTC
  workflow_dispatch:       # anche manuale dal tab Actions

permissions:
  contents: write

jobs:
  aggiorna-dati:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Sequenziale: due leghe che spingono su main in parallelo si
      # pestano i piedi (il secondo fa rebase su un commit che il primo
      # sta ancora scrivendo).
      max-parallel: 1
      fail-fast: false
      matrix:
        league: [seriea, eredivisie]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Controllo di presenza del secret. La env va dichiarata SULLO STEP
      # che usa l'API (predict_fixtures), non qui: la env di GitHub Actions
      # e' per-step, quindi dichiararla solo come controllo non la inoltra.
      - name: Quote TheOddsAPI (secret)
        env:
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
        run: |
          if [ -n "$THEODDSAPI_KEY" ]; then
            echo "Chiave TheOddsAPI presente e inoltrata agli step successivi"
          else
            echo "ATTENZIONE: secret THEODDSAPI_KEY non impostato."
            echo "Le previsioni future avranno bm=null (solo le giocate avranno quote)."
          fi

      # Il CSV di football-data.co.uk porta risultati E quote B365: e' la
      # fonte dei risultati reali (openfootball e' fermo al 22-09, quindi da
      # solo non arriverebbe piu' nessun risultato). Se il download fallisce
      # lo step si ferma (exit code != 0) invece di pubblicare un JSON
      # vuoto o con risultati mancanti.
      - name: Scarica dati stagione corrente
        run: python src/download_data.py --league ${{ matrix.league }}

      - name: Clean dati
        run: python src/clean_data.py --league ${{ matrix.league }}

      - name: Pi-Rating (Dixon-Coles)
        run: python src/ratings.py --league ${{ matrix.league }}

      - name: Feature engineering
        run: python src/features.py --league ${{ matrix.league }}

      # Serve perche' il .cbm non e' nel repo: sul runner si allena qui.
      # Il training e' temporale (cutoff 2025-08-01), quindi le partite del
      # 2026 non entrano mai nel training: nessun lookahead.
      - name: Train CatBoost
        run: python src/model.py --league ${{ matrix.league }}

      # predict_fixtures rigenera webapp/public/predictions_<lega>.json:
      # risultati reali, quote, confronto bookmaker e simulazione Kelly.
      # La regola del freeze e' stata rimossa: le stime delle partite gia'
      # giocate vengono ricalcolate come tutte le altre.
      - name: Rigenera predictions.json
        env:
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
        run: python src/predict_fixtures.py --league ${{ matrix.league }}

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/public/
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo: niente da committare."
            exit 0
          fi
          git commit -m "ci: aggiorna dati ${{ matrix.league }} ($(date +%Y-%m-%d))"
          # Se pipeline.yml ha committato nello stesso minuto, rebase e riprova.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rifiutato: rebase e ritento ($i/3)"
            git pull --rebase --autostash origin main || {
              git rebase --abort 2>/dev/null || true
              git reset --hard HEAD 2>/dev/null || true
              echo "Rebase in conflitto: abort pulito."
              exit 1
            }
          done
          echo "Push fallito dopo 3 tentativi"
          exit 1
